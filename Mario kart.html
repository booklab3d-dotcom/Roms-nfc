<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>Super Mario Kart - Cartucho NFC</title>
        <style>
            * {
                box-sizing: border-box;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
                font-family: Arial, sans-serif;
            }

            /* Contenedor del juego forzado a pantalla completa */
            #game {
                width: 100vw !important;
                height: 100vh !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
            }

            /* Forzar el canvas/iframe interno de EmulatorJS a ocupar el 100% */
            #game iframe, #game canvas {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }
        </style>
    </head>
    <body>
        <!-- Contenedor único para el emulador -->
        <div id="game"></div>

        <script>
            // Configuración de EmulatorJS
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Super Mario Kart";
            EJS_color = "#e52521";
            
            // Inicia directamente cargando el menú principal y el botón nativo Start Game
            EJS_startOnLoaded = false;
            
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_gameUrl = "https://cdn.jsdelivr.net/gh/booklab3d-dotcom/Roms-nfc@main/mario-kart.smc";
;

        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
