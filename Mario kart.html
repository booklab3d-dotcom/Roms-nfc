<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>Super Mario Kart - Cartucho NFC</title>
        <style>
            * {
                box-sizing: border-box;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
                font-family: Arial, sans-serif;
            }

            /* Contenedor del juego forzado a cubrir toda la pantalla */
            #game {
                width: 100vw !important;
                height: 100vh !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Forzar el canvas/iframe interno de EmulatorJS a pantalla completa */
            #game iframe, #game canvas, #game div {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }

            /* Pantalla inicial aislada */
            #start-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 99999;
            }

            /* Botón de Play retro */
            .play-btn {
                background-color: #e52521;
                color: #ffffff;
                border: none;
                padding: 18px 36px;
                font-size: 20px;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(229, 37, 33, 0.4);
                transition: transform 0.2s, background-color 0.2s;
                letter-spacing: 1px;
                -webkit-tap-highlight-color: transparent;
            }

            .play-btn:active {
                transform: scale(0.95);
                background-color: #b31b18;
            }

            .rotate-hint {
                color: #888;
                font-size: 13px;
                margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <!-- Overlay inicial -->
        <div id="start-screen">
            <button class="play-btn" id="btn-play">PLAY PARA JUGAR</button>
            <p class="rotate-hint">📱 Para mejor experiencia, gira tu teléfono</p>
        </div>

        <!-- Contenedor del emulador -->
        <div id="game"></div>

        <script>
            // Configuración de EmulatorJS
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Super Mario Kart";
            EJS_color = "#e52521";
            EJS_startOnLoaded = false;
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_gameUrl = "https://cdn.jsdelivr.net/gh/booklab3d-dotcom/Roms-nfc@main/Super%20Mario%20Kart%20%28E%29.smc";

            document.getElementById('btn-play').addEventListener('click', function() {
                // 1. Ocultar la pantalla de inicio
                document.getElementById('start-screen').style.display = 'none';

                // 2. Activar modo Pantalla Completa nativa en el teléfono
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(function(err) {});
                } else if (elem.webkitRequestFullscreen) { // Safari / iOS
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }

                // 3. Intentar bloquear la orientación en horizontal (Landscape) en celulares compatibles
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {});
                }

                // 4. Arrancar el emulador
                if (window.EJS_emulator) {
                    window.EJS_emulator.start();
                }
            });
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
