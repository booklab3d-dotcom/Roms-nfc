<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Super Mario Kart - Cartucho NFC</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
                overflow: hidden;
                font-family: Arial, sans-serif;
            }

            /* Pantalla inicial aislada */
            #start-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            /* Botón de Play estilo retro */
            .play-btn {
                background-color: #e52521;
                color: #ffffff;
                border: none;
                padding: 18px 36px;
                font-size: 20px;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(229, 37, 33, 0.4);
                transition: transform 0.2s, background-color 0.2s;
                letter-spacing: 1px;
                -webkit-tap-highlight-color: transparent;
            }

            .play-btn:active {
                transform: scale(0.95);
                background-color: #b31b18;
            }

            .rotate-hint {
                color: #888;
                font-size: 13px;
                margin-top: 15px;
            }

            /* Forzar visualización al girar en pantalla horizontal */
            @media screen and (orientation: landscape) {
                #game, iframe, canvas {
                    width: 100vw !important;
                    height: 100vh !important;
                }
            }
        </style>
    </head>
    <body>
        <!-- Overlay inicial -->
        <div id="start-screen">
            <button class="play-btn" onclick="iniciarJuego()">PLAY PARA JUGAR</button>
            <p class="rotate-hint">📱 Para mejor experiencia, gira tu teléfono</p>
        </div>

        <!-- Contenedor del juego -->
        <div style="width:100%;height:100%;">
            <div id="game"></div>
        </div>

        <script>
            // Configuración aislada para Super Mario Kart
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Super Mario Kart";
            EJS_color = "#e52521";
            
            // Pausado hasta presionar Play
            EJS_startOnLoaded = false;
            
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Enlace con CDN directa a la ROM
            EJS_gameUrl = "https://cdn.jsdelivr.net/gh/booklab3d-dotcom/Roms-nfc@main/Super%20Mario%20Kart%20%28E%29.smc";

            function iniciarJuego() {
                // Ocultar overlay
                document.getElementById('start-screen').style.display = 'none';

                // Intentar pantalla completa del navegador
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(function(e){});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }

                // Iniciar emulador
                if (window.EJS_emulator) {
                    window.EJS_emulator.start();
                }
            }
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
