<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>Maximum Carnage - Cartucho NFC</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body, html {
                width: 100%;
                height: 100%;
                background-color: #000;
                overflow: hidden;
            }

            #game {
                width: 100vw !important;
                height: 100vh !important;
                position: absolute;
                top: 0;
                left: 0;
            }

            /* Forzamos el ajuste de posición sobre la estructura interna de EmulatorJS */
            #game div, #game iframe {
                width: 100% !important;
                height: 100% !important;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>

        <script>
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Maximum Carnage";
            EJS_color = "#cb0000";
            
            EJS_startOnLoaded = false;
            
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_gameUrl = "https://cdn.jsdelivr.net/gh/booklab3d-dotcom/Roms-nfc@main/Carnage.smc";

            // Inyección de script para reposicionar el botón Start Game cuando se renderice
            window.addEventListener('load', function() {
                var checkExist = setInterval(function() {
                    var startBtn = document.querySelector('.ejs_start_button') || 
                                   document.querySelector('#game button') || 
                                   document.querySelector('button');
                    
                    if (startBtn) {
                        var container = startBtn.parentElement;
                        if (container) {
                            container.style.display = 'flex';
                            container.style.flexDirection = 'column';
                            container.style.justifyContent = 'flex-start';
                            container.style.paddingTop = '20vh';
                        }
                        startBtn.style.marginTop = '20vh';
                        clearInterval(checkExist);
                    }
                }, 100);
            });
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
