<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>Maximum Carnage - Cartucho NFC</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                width: 100%;
                height: 100%;
                background-color: #000;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
            }

            #game {
                width: 100% !important;
                height: 100% !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
            }

            #game iframe, 
            #game canvas, 
            #game div {
                max-width: 100% !important;
                max-height: 100% !important;
                object-fit: contain !important;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>

        <script>
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Spider-Man & Venom - Maximum Carnage";
            EJS_color = "#cb0000";
            
            EJS_startOnLoaded = false;
            
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Enlace RAW directo para la ROM de Maximum Carnage
            EJS_gameUrl = "https://raw.githubusercontent.com/booklab3d-dotcom/Roms-nfc/main/Spider-Man%20%26%20Venom%20-%20Maximum%20Carnage.smc";
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
