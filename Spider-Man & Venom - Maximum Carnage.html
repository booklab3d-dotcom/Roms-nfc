<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>Maximum Carnage - Cartucho NFC</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body, html {
                width: 100%;
                height: 100%;
                background-color: #000;
                overflow: hidden;
                font-family: system-ui, -apple-system, sans-serif;
            }

            /* Overlay inicial sin interferir con el emulador */
            #start-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000;
                z-index: 99999;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Botón ubicado alto (a 18vh del borde superior) */
            .play-btn {
                position: absolute;
                top: 18vh;
                background-color: #cb0000;
                color: #ffffff;
                border: none;
                padding: 18px 36px;
                font-size: 20px;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(203, 0, 0, 0.6);
                transition: transform 0.2s, background-color 0.2s;
                letter-spacing: 1px;
                -webkit-tap-highlight-color: transparent;
            }

            .play-btn:active {
                transform: scale(0.95);
                background-color: #990000;
            }

            .rotate-hint {
                position: absolute;
                top: calc(18vh + 70px);
                color: #888;
                font-size: 13px;
            }

            /* Contenedor exacto para el emulador */
            #game {
                width: 100vw !important;
                height: 100vh !important;
                position: absolute;
                top: 0;
                left: 0;
            }
        </style>
    </head>
    <body>
        <!-- Pantalla de inicio aislada -->
        <div id="start-screen">
            <button class="play-btn" id="playBtn">PLAY PARA JUGAR</button>
            <p class="rotate-hint">📱 Para mejor experiencia, gira tu teléfono</p>
        </div>

        <!-- Emulador -->
        <div id="game"></div>

        <script>
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Maximum Carnage";
            EJS_color = "#cb0000";
            
            // Iniciar automáticamente una vez se presione el botón
            EJS_startOnLoaded = false;
            
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_gameUrl = "https://cdn.jsdelivr.net/gh/booklab3d-dotcom/Roms-nfc@main/Carnage.smc";

            document.getElementById('playBtn').addEventListener('click', function() {
                // Ocultar la pantalla de inicio
                document.getElementById('start-screen').style.display = 'none';

                // Activar pantalla completa en el navegador del celular
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(function(){});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }

                // Iniciar el emulador y habilitar los controles táctiles nativos
                if (window.EJS_emulator && typeof window.EJS_emulator.start === 'function') {
                    window.EJS_emulator.start();
                } else if (window.EJS_emulator && window.EJS_emulator.game && typeof window.EJS_emulator.game.start === 'function') {
                    window.EJS_emulator.game.start();
                }
            });
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
