<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>Maximum Carnage - Cartucho NFC</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body, html {
                width: 100%;
                height: 100%;
                background-color: #000;
                overflow: hidden;
            }

            #game {
                width: 100vw !important;
                height: 100vh !important;
                position: absolute;
                top: 0;
                left: 0;
            }

            /* Eleva el menú inicial y el botón nativo Start Game de EmulatorJS */
            #game > div {
                justify-content: flex-start !important;
                padding-top: 20vh !important;
            }

            #game iframe, #game canvas {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
            }
        </style>
    </head>
    <body>
        <!-- Contenedor único del emulador sin overlays personalizados -->
        <div id="game"></div>

        <script>
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_multitap = true;
            EJS_gameName = "Maximum Carnage";
            EJS_color = "#cb0000";
            
            // Inicia en la pantalla predeterminada del emulador
            EJS_startOnLoaded = false;
            
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Enlace a la ROM
            EJS_gameUrl = "https://cdn.jsdelivr.net/gh/booklab3d-dotcom/Roms-nfc@main/Carnage.smc";
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
